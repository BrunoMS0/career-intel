services:
  db:
    image: pgvector/pgvector:pg17
    container_name: career-intel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_intel
    ports:
      # A locally installed Postgres already owning this port answers the
      # connection and rejects it as "password authentication failed", which
      # reads like a config bug rather than a port clash. Override DB_PORT.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only when the volume is empty. Drop the volume to re-apply.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Behind a profile, so `docker compose up -d` still brings up Postgres alone
  # and `pnpm dev` stays the development loop. Run the containerised app with
  # `docker compose --profile app up -d --build`.
  app:
    build: .
    profiles: ["app"]
    environment:
      # Not the DATABASE_URL from .env: that one points at the port Postgres is
      # published on for the host. Inside the compose network the service is
      # reachable as `db` on 5432, whatever DB_PORT says.
      DATABASE_URL: postgres://postgres:postgres@db:5432/career_intel
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:?set it in .env}
      CHAT_MODEL: ${CHAT_MODEL:-gemma-4-31b-it}
      # Optional: ingestion falls back to unpdf when this is empty.
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
